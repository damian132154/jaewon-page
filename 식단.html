<title>식단 · 칼로리</title>

:root{--bg:#f7f8fb;--card:#fff;--ink:#151922;--ink2:#5b6472;--ink3:#98a0ac;

*{box-sizing:border-box}
body{margin:0;color:var(--ink);
 font-family:"맑은 고딕",Malgun Gothic,system-ui,sans-serif;
 background:radial-gradient(880px 400px at 50% -12%,#e6f5f1 0%,transparent 60%),
 var(--bg)}
.wrap{max-width:840px;margin:0 auto;padding:42px 20px 90px}
header{text-align:center;margin-bottom:6px}
h1{margin:0 0 5px;font-size:28px;font-weight:800;letter-spacing:-.02em}
h1 b{color:var(--accent)}
.lead{margin:0;color:var(--ink2);font-size:13px}
#today{text-align:center;font-size:13.5px;color:var(--ink2);margin:8px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;
 padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(21,25,34,.05);
 border-top:3px solid var(--c,var(--accent))}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.ci{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
 justify-content:center;font-size:15px;color:var(--c,var(--accent));
 background:color-mix(in srgb,var(--c,#0f766e) 12%,#fff)}
.ct{font-size:14.5px;font-weight:700}
.cs{font-size:11.5px;color:var(--ink3);margin-left:auto}
label{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
input,select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;
 font-size:13.5px;font-family:inherit;outline:none;color:var(--ink)}
input:focus,select:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
 gap:9px}
.grid input,.grid select{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sg{border:1px solid var(--line);background:#fff;color:var(--ink2);
 padding:7px 14px;border-radius:20px;font-size:12px;cursor:pointer;
 font-family:inherit;font-weight:700}
.sg.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tdee{margin-top:13px;padding:13px 15px;background:#f2faf8;border-radius:11px;

.tdee b{color:var(--ink);font-size:15px}
.big{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:100px;background:#fff;border:1px solid var(--line);
 border-radius:13px;padding:14px 10px;text-align:center}
.kv{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kl{font-size:11.5px;color:var(--ink2);margin-top:3px}
.kpi.over .kv{color:var(--red)}
.bar{height:9px;background:#eef1f5;border-radius:20px;overflow:hidden;
 margin:11px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:20px;
 transition:.25s}
.bar.over i{background:var(--red)}
.macro{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);
 margin-top:8px}
.macro b{color:var(--ink)}
#q{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:11px;
 font-size:13.5px;font-family:inherit;outline:none}
#res{margin-top:9px;max-height:230px;overflow-y:auto}
.fr{display:flex;align-items:center;gap:10px;padding:8px 10px;
 border-radius:9px;cursor:pointer;font-size:13px}
.fr:hover{background:#f2faf8}
.fn{flex:1}
.fk{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mealbox{margin-top:6px}
.meal{margin-bottom:12px}
.mh{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;
 margin-bottom:5px}
.mk{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400}
.item{display:flex;align-items:center;gap:9px;padding:7px 11px;

 font-size:12.5px;background:#fff}
.item .in{flex:1}
.item .iq{width:52px;padding:4px 6px;font-size:12px;text-align:center}
.item .ik{font-size:12px;color:var(--ink2);min-width:60px;text-align:right;
 font-variant-numeric:tabular-nums}
.item .ix{border:none;background:none;color:var(--ink3);cursor:pointer}
.item .ix:hover{color:var(--red)}
.wrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.wrow input{width:110px}
.wrow button,#addcustom{padding:9px 18px;border:none;border-radius:9px;
 background:var(--accent);color:#fff;font-size:13px;font-weight:700;
 cursor:pointer;font-family:inherit}
.hist{margin-top:11px;font-size:12.5px;color:var(--ink2);line-height:1.9}
.hist span{font-family:ui-monospace,Consolas,monospace;color:var(--ink);
 font-weight:700;margin-right:7px}
.tip{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.7}
footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:34px;
 line-height:1.8}

.calh{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.calh .m{font-weight:800;font-size:15px;letter-spacing:-.01em;
 min-width:88px;text-align:center;font-variant-numeric:tabular-nums}
.cb{border:1px solid var(--line);background:#fff;color:var(--ink2);
 border-radius:9px;padding:6px 13px;font:inherit;font-size:13px;
 font-weight:700;cursor:pointer}
.cb:hover{background:#f2f5f9}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{font-size:10.5px;color:var(--ink3);text-align:center;font-weight:700;
 padding-bottom:3px}
.cd{aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;
 background:#fff;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:1px;cursor:pointer;padding:2px;font:inherit}
.cd:hover{border-color:var(--accent)}
.cd .cn{font-size:12px;font-weight:700;color:#b3bcc8;line-height:1.1}
.cd .cm{font-size:10px;color:var(--ink3);line-height:1.2;font-weight:700;

.cd.blank{border:none;background:none;cursor:default}
.cd.ate{background:#fff5ec;border-color:#f0c9a6}

.cd.did{background:#eaf6f3;border-color:#a8d8ce}

.cd.sel{border-color:var(--ink);border-width:2px}

<div class="wrap">
<header><h1>식단 <b>· 칼로리</b></h1>
<p class="lead">먹은 것을 누르기만 하면 된다.</p></header>
<div id="today"></div>

<div class="card" style="--c:#2563eb">
  <div class="ch"><div class="ci">◑</div><div class="ct">내 몸 · 목표</div>
    <span class="cs">한 번만 넣으면 기억한다</span></div>
  <div class="grid">
    <label>성별
      <select id="sex"><option value="M">남</option>
      <option value="F">여</option></select></label>
    <label>나이 <input type="number" id="age" min="10" max="90"></label>
    <label>키 cm <input type="number" id="ht" min="120" max="220"></label>
    <label>몸무게 kg <input type="number" id="wt" step="0.1"></label>
  </div>
  <div class="seg" id="act"></div>
  <div class="seg" id="goal"></div>
  <div class="tdee" id="tdee"></div>
</div>

<div class="card" style="--c:#0f766e">
  <div class="ch"><div class="ci">▤</div><div class="ct">오늘 먹은 것</div>
    <span class="cs" id="dsum"></span></div>
  <div class="big">
    <div class="kpi"><div class="kv" id="kEat">0</div><div class="kl">먹음</div></div>
    <div class="kpi"><div class="kv" id="kTar">0</div><div class="kl">목표</div></div>
    <div class="kpi" id="kpiLeft"><div class="kv" id="kLeft">0</div>
      <div class="kl">남음</div></div>
  </div>
  <div class="bar" id="bar"><i style="width:0%"></i></div>
  <div class="macro" id="macro"></div>
  <div class="mealbox" id="meals"></div>
</div>

<div class="card" style="--c:#c2410c">
  <div class="ch"><div class="ci">◈</div><div class="ct">음식 찾기</div>
    <span class="cs" id="mealsel"></span></div>
  <div class="seg" id="mealseg"></div>
  <span class="cs" id="qn" style="float:right"></span>
  <input id="q" placeholder="음식 이름 · 초성 (예: 삼각, ㄱㅊㅉㄱ)"
    autocomplete="off" style="margin-top:10px">
  <div id="res"></div>
  <div class="grid" style="margin-top:11px">
    <input type="text" id="cn" placeholder="직접 입력 — 이름">
    <input type="number" id="ck" placeholder="kcal">
    <button id="addcustom">추가</button>
  </div>
</div>

<div class="card" style="--c:#b45309">
  <div class="ch"><div class="ci">◷</div><div class="ct">이번 주 · 추이</div>
    <span class="cs">하루보다 일주일이 정확하다</span></div>
  <div class="big">
    <div class="kpi"><div class="kv" id="wAvg">—</div>
      <div class="kl">7일 평균 섭취</div></div>
    <div class="kpi"><div class="kv" id="wDef">—</div>
      <div class="kl">하루 평균 적자</div></div>
    <div class="kpi"><div class="kv" id="wPred">—</div>
      <div class="kl">이 추세면 주당</div></div>
  </div>
  <div class="tip" id="wnote"></div>
</div>

<div class="card" style="--c:#7c3aed">
  <div class="ch"><div class="ci">◎</div><div class="ct">몸무게 기록</div></div>
  <div class="wrow">
    <input type="number" id="wnew" step="0.1" placeholder="kg">
    <button id="wadd">오늘 기록</button>
    <span class="cs" id="wtrend"></span>
  </div>
  <div class="hist" id="whist"></div>
</div>


<!-- ── 날짜별 기록 ────────────────────────────── -->
<div class="card" style="--c:#475569">
  <div class="ch"><div class="ci">▤</div><div class="ct">날짜별 기록</div>
    <span class="cs" id="calinfo"></span></div>
  <div class="calh">
    <button class="cb" id="mPrev">&lsaquo;</button>
    <div class="m" id="mLabel"></div>
    <button class="cb" id="mNext">&rsaquo;</button>
    <button class="cb" id="mToday" style="margin-left:auto">오늘</button>
  </div>
  <div class="cal" id="cal2"></div>
  <div class="leg">
    <span><i style="background:#fff5ec;border-color:#f0c9a6"></i>먹은 기록</span>
    <span><i style="background:#eaf6f3;border-color:#a8d8ce"></i>운동</span>

  </div>
  <div class="dayd" id="dayd"></div>
</div>

<footer>이 브라우저에 저장된다 · 계산은 Mifflin-St Jeor 추정값이다</footer>
</div>

let BMR=0,TDEE=0,TARGET=0;
let PROT=0, FIB=0, WATER=0, FLOOR=0;
function calc(){
  // Mifflin-St Jeor — 체지방률을 모를 때 가장 오차가 작다
  BMR=Math.round(10*P.wt+6.25*P.ht-5*P.age+(P.sex==='M'?5:-161));
  TDEE=Math.round(BMR*P.act);
  // 주당 몇 kg 인지 → 하루 적자. 지방 1 kg ≈ 7700 kcal
  const kgWk=P.wt*P.goal/100;
  const daily=Math.round(kgWk*7700/7);
  // 하한 : 기초대사량 밑으로는 안 내린다 (남 1500 / 여 1200 이 통상 하한)
  FLOOR=Math.max(P.sex==='M'?1500:1200, Math.round(BMR*0.95));
  TARGET=Math.max(FLOOR, TDEE+daily);
  const capped=(TDEE+daily)<FLOOR;
  // 단백질 : 감량 중 근손실을 막으려면 체중당 1.6~2.2 g
  PROT=Math.round(P.wt*(P.goal<0?1.8:1.4));
  FIB=P.sex==='M'?30:25;                 // 섬유질 g
  WATER=(P.wt*33/1000).toFixed(1);       // 물 L
  const bmi=(P.wt/Math.pow(P.ht/100,2)).toFixed(1);
  const bmiTxt=bmi<18.5?'저체중':bmi<23?'정상':bmi<25?'과체중':'비만';
  el('tdee').innerHTML=
    '기초대사량 <b>'+BMR+'</b> kcal　·　활동 포함(TDEE) <b>'+TDEE+'</b> kcal'+
    '　·　BMI <b>'+bmi+'</b> ('+bmiTxt+')<br>'+
    '오늘 목표 <b>'+TARGET+'</b> kcal'+
    (P.goal?'　→　주당 <b>'+kgWk.toFixed(2)+'</b> kg · '+
      '하루 적자 <b>'+Math.abs(daily)+'</b> kcal':'　→　유지')+
    '<br>단백질 <b>'+PROT+'</b> g　·　섬유질 <b>'+FIB+'</b> g　·　물 <b>'+
    WATER+'</b> L'+
    (capped?'<br><span style="color:#c2410c">계산값이 하한('+FLOOR+
     ' kcal)보다 낮아 하한으로 맞췄다. 더 줄이면 근손실·대사적응이 온다.</span>':'')+
    (P.goal<=-1.0?'<br><span style="color:#c2410c">−1 %/주는 상한이다. '+
     '이보다 빠르면 대부분 근육과 수분이 빠진다.</span>':'');
}

// 한글 초성 검색 — 「ㅅㄱㄱㅂ」 으로도 「삼각김밥」 이 나온다
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s){let o='';for(const c of s){const u=c.charCodeAt(0)-0xAC00;
  o+=(u>=0&&u<11172)?CHO[Math.floor(u/588)]:c;}return o;}
function norm(s){return s.replace(/\s+/g,'').toLowerCase();}
function hit(name,q){
  if(!q)return true;
  const n=norm(name),s=norm(q);
  if(n.includes(s))return true;
  return /^[ㄱ-ㅎ]+$/.test(s)&&cho(n).includes(s);
}
function live(input,fn){
  // 한글은 조합이 끝나야 input 이 뜨는 브라우저가 있다. 셋 다 듣는다.
  const go=()=>fn(input.value.trim());
  ['input','keyup','compositionupdate','compositionend'].forEach(
    e=>input.addEventListener(e,go));
}

    Math.round(F)+'g</b>　단백 <b style="color:'+(pOk?'#0f766e':'#c2410c')+
    '">'+Math.round(Pr)+' / '+PROT+'g</b>'+
    (pOk?'　✓ 충분':'　← 더 먹어야 근손실이 안 온다');

  el('meals').innerHTML=MEALS.map(m=>{
    const sub=its.map((x,idx)=>[x,idx]).filter(([x])=>x.m===m);
    if(!sub.length)return '';
    const mk=Math.round(sub.reduce((a,[x])=>a+x.k*x.q,0));
    return '<div class="meal"><div class="mh">'+m+
      '<span class="mk">'+mk+' kcal</span></div>'+
      sub.map(([x,idx])=>
        '<div class="item"><span class="in">'+x.n+'</span>'+
        '<input class="iq" type="number" step="0.5" min="0.5" value="'+x.q+
        '" data-i="'+idx+'"><span class="ik">'+Math.round(x.k*x.q)+
        ' kcal</span><button class="ix" data-i="'+idx+'">✕</button></div>'
      ).join('')+'</div>';
  }).join('')||'<div class="tip">아직 없다. 아래에서 음식을 눌러 담는다.</div>';

function week(){
  const days=[];
  for(let i=0;i<7;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const vals=days.map(k=>{
    const its=(DB[k]||{}).items||[];
    return its.reduce((a,x)=>a+x.k*x.q,0);
  }).filter(v=>v>0);
  if(!vals.length){
    el('wAvg').textContent='—';el('wDef').textContent='—';
    el('wPred').textContent='—';
    el('wnote').textContent='아직 기록이 부족하다. 3 일만 쌓여도 의미가 생긴다.';
    return;
  }
  const avg=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const def=TDEE-avg;
  const kgWk=(def*7/7700);
  el('wAvg').textContent=avg;
  el('wDef').textContent=(def>0?'−':'+')+Math.abs(def);
  el('wPred').textContent=(kgWk>0?'−':'+')+Math.abs(kgWk).toFixed(2)+' kg';
  // 체중 이동평균 — 하루 체중은 수분 때문에 ±1 kg 흔들린다
  const wk=Object.keys(W).sort().slice(-7).map(k=>W[k]);
  let mvTxt='';
  if(wk.length>=3){
    const mv=(wk.reduce((a,b)=>a+b,0)/wk.length).toFixed(1);
    const first=Object.keys(W).sort().slice(-7)[0];
    mvTxt='　·　7일 이동평균 <b>'+mv+' kg</b> (하루 체중은 수분으로 ±1 kg 흔들린다 — '+
      '이동평균으로 봐야 한다)';
  }
  el('wnote').innerHTML='기록한 날 '+vals.length+' 일 기준'+mvTxt+
    '　·　하루 편차보다 <b>주 평균</b>이 실제 체중 변화와 맞는다.';
}
function nightCheck(){
  const its=items();
  const night=its.filter(x=>x.m==='야식').reduce((a,x)=>a+x.k*x.q,0);
  const tot=its.reduce((a,x)=>a+x.k*x.q,0);
  if(!night)return '';
  const pct=Math.round(night/tot*100);
  let msg='야식 <b>'+Math.round(night)+' kcal</b> ('+pct+'%)';
  if(pct>=25)msg+=' — 하루의 1/4 이 야식이다. 총량이 같아도 '+
    '늦게 먹으면 혈당 반응이 나빠진다는 보고가 많다. 저녁을 늘려 야식을 줄이는 쪽이 낫다.';
  else if(night>300)msg+=' — 300 kcal 을 넘었다. 잠들기 3 시간 전에 끝내는 것이 좋다.';
  else msg+=' — 이 정도면 괜찮다.';
  return '<div class="tip" style="color:#c2410c">'+msg+'</div>';
}

  let h=['월','화','수','목','금','토','일']
    .map(d=>'<div class="cw">'+d+'</div>').join('');
  for(let i=0;i<lead;i++)h+='<div class="cd blank"></div>';
  let mk=0,mDay=0,mEx=0,mKm=0;
  for(let day=1;day<=last.getDate();day++){
    const k=ymd2(new Date(y,m,day));
    const kc=kcalOf(k), ex=repsOf2(k)+absOf2(k), km=kmOf2(k);
    if(kc){mk+=kc;mDay++;}
    if(ex||km){mEx++;mKm+=km;}
    const cls=kc&&(ex||km)?'both':(kc?'ate':((ex||km)?'did':''));
    h+='<button class="cd '+cls+(k===viewK?' sel':'')+
      (k===KEY?' tod':'')+'" data-k="'+k+'">'+
      '<div class="cn">'+day+'</div><div class="cm">'+
      (kc?Math.round(kc/100)/10+'k':'')+
      (kc&&(ex||km)?'<br>':'')+
      (km?km.toFixed(1)+'km':(ex?'운동':''))+'</div></button>';
  }
  el('cal2').innerHTML=h;
  el('cal2').querySelectorAll('[data-k]').forEach(b=>{
    b.onclick=()=>{viewK=b.dataset.k;calBox();};});
  el('calinfo').textContent=
    '먹은 날 '+mDay+'일'+(mDay?' · 평균 '+Math.round(mk/mDay)+' kcal':'')+
    ' · 운동 '+mEx+'일'+(mKm?' · '+mKm.toFixed(1)+' km':'');
  dayBox();
}

function dayBox(){
  const k=viewK, d=new Date(k+'T00:00:00');
  const items=((DB[k]||{}).items||[]);
  const kc=kcalOf(k), reps=repsOf2(k), abs=absOf2(k), km=kmOf2(k);
  const runs=WRUN.filter(x=>x.d===k);
  const wt=W[k];
  let h='<div class="ddh"><b>'+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+
    DOWK[d.getDay()]+'요일</b>'+(k===KEY?'<span class="ddt">오늘</span>':'')+
    '<span class="ddk">'+(kc?Math.round(kc)+' kcal':'기록 없음')+'</span></div>';

  h+='<div class="ddl">먹은 것</div>';
  if(items.length){
    h+=MEALS.map(mn=>{
      const g=items.filter(x=>x.m===mn);
      if(!g.length)return '';
      const sum=g.reduce((a,b)=>a+(+b.k||0)*(+b.q||1),0);
      return '<div class="ddl" style="margin:8px 0 5px;color:var(--warm);'+
        'text-transform:none;font-size:12px">'+
        mn+' <span style="color:var(--ink3);font-weight:700">'+
        Math.round(sum)+' kcal</span></div><div class="ddm">'+
        g.map(x=>'<span class="ddi"><b>'+esc2(x.n)+'</b>'+
          ((+x.q||1)!==1?' ×'+x.q:'')+' <s>'+
          Math.round((+x.k||0)*(+x.q||1))+'</s></span>').join('')+'</div>';
    }).join('');
  } else {
    h+='<div class="ddx">이 날은 적은 것이 없다.</div>';
  }

  h+='<div class="ddl">운동</div>';
  if(reps||abs||km){
    const bits=[];
    if(reps)bits.push('푸시업 <b>'+reps+'</b>개');
    if(abs)bits.push('AB <b>'+abs+'</b>세트');
    if(km)bits.push('달리기 <b>'+km.toFixed(1)+'</b> km'+
      (runs.length&&runs[0].min?' · '+runs[0].min+'분':''));
    h+='<div class="ddw">'+bits.map(x=>'<span>'+x+'</span>').join('')+'</div>';
  } else {
    h+='<div class="ddx">이 날은 운동 기록이 없다.</div>';
  }

  if(wt!=null)h+='<div class="ddl">몸무게</div>'+
    '<div class="ddw"><span><b>'+wt+'</b> kg</span></div>';
  el('dayd').innerHTML=h;
}
function esc2(s){return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

calBox();
</script>
<script>
(function(){
 var B='http://127.0.0.1:8765', K='NY_VYjt2P89920mftfQRhaQj';
 var P=Storage.prototype, setI=P.setItem, delI=P.removeItem;
 var Q='__pending', live=false, buf={}, timer=null;
 function pend(){try{return JSON.parse(localStorage.getItem(Q)||'{}');}
   catch(e){return {};}}
 function setPend(o){try{setI.call(localStorage,Q,JSON.stringify(o));}
   catch(e){}}
 function badge(){
   var n=document.getElementById('__syncbadge');
   if(!n){n=document.createElement('div');n.id='__syncbadge';
     n.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99998;'+
       'font:600 12px/1.4 inherit;padding:7px 13px;border-radius:20px;'+
       'box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:default';
     document.body.appendChild(n);}
   var k=Object.keys(pend()).length;
   clearTimeout(n.__t);
   n.style.transition='opacity .4s';n.style.opacity='1';
   if(live){n.style.background='#0f766e';n.style.color='#fff';
     n.textContent='기록 중 · 파일에 저장됨';
     // 잘 되고 있으면 굳이 계속 띄워 둘 필요가 없다
     n.__t=setTimeout(function(){n.style.opacity='0';},3500);}
   else{n.style.background='#c2410c';n.style.color='#fff';
     n.textContent=k?('기록 '+k+' 건 대기 · PC 켜면 저장된다')
                    :'이 기기에서는 파일에 저장 안 됨';}
 }
 function push(d,cb){
   fetch(B+'/api/ls?k='+K,{method:'POST',mode:'cors',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({d:d})})
    .then(function(r){live=r.ok;if(r.ok&&cb)cb();badge();})
    .catch(function(){live=false;badge();});
 }
 function flush(){
   timer=null;
   var o=pend();
   for(var k in buf)o[k]=buf[k];
   buf={};
   if(!Object.keys(o).length)return;
   setPend(o);
   push(o,function(){setPend({});});
 }
 function queue(k,v){
   if(k===Q)return;
   buf[k]=v;clearTimeout(timer);timer=setTimeout(flush,600);
 }
 P.setItem=function(k,v){setI.call(this,k,v);
   if(this===localStorage)queue(k,String(v));};
 P.removeItem=function(k){delI.call(this,k);
   if(this===localStorage)queue(k,null);};
 addEventListener('pagehide',flush);
 // 처음에 서버 것을 받아 온다 — 서버가 원본이다
 fetch(B+'/api/ls?k='+K,{mode:'cors'})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(j){
    if(!j)return;
    live=true;
    (j.x||[]).forEach(function(k){delI.call(localStorage,k);});
    var mine={}, changed=false;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k!==Q&&!(k in j.d)&&(j.x||[]).indexOf(k)<0)
        mine[k]=localStorage.getItem(k);
    }
    for(var k2 in j.d){
      if(localStorage.getItem(k2)!==j.d[k2])changed=true;
      setI.call(localStorage,k2,j.d[k2]);
    }
    var q=pend();for(var k3 in q)mine[k3]=q[k3];
    if(Object.keys(mine).length)push(mine,function(){setPend({});});
    badge();
    // 값이 실제로 달라졌을 때만, 그것도 이 탭에서 딱 한 번만 다시 그린다.
    // (예전엔 무조건 reload 라 무한 새로고침이 났다)
    try{
      if(changed&&!sessionStorage.getItem('__synced')){
        sessionStorage.setItem('__synced','1');
        location.reload();
      }
    }catch(e){}
  })
  .catch(function(){live=false;badge();});
 addEventListener('DOMContentLoaded',badge);
 setInterval(function(){ if(!live) flush(); }, 20000);
})();
</script>
