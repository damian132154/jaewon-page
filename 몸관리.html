<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몸 관리</title>
<style>
:root{--bg:#f6f8fa;--ink:#141821;--ink2:#5a6472;--ink3:#98a1ad;
--line:#e3e8ee;--diet:#0f766e;--gym:#1d4ed8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"맑은 고딕",Malgun Gothic,system-ui,sans-serif;
 display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--line);
 padding:10px 16px 0;flex:0 0 auto}
.top{display:flex;align-items:baseline;gap:10px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
h1 b{color:var(--diet)}
.lead{margin:0;font-size:11.5px;color:var(--ink3)}
.tabs{display:flex;gap:4px;max-width:900px;margin:8px auto 0}
.tb{border:none;background:none;padding:9px 16px 10px;font-size:13.5px;
 font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;
 border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tb:hover{color:var(--ink)}
.tb.on{color:var(--c);border-bottom-color:var(--c)}
.tb[data-t="diet"]{--c:var(--diet)}
.tb[data-t="gym"]{--c:var(--gym)}
main{flex:1 1 auto;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;
 background:var(--bg)}
iframe.hide{display:none}
</style></head><body>
<header>
  <div class="top">
    <h1>몸 <b>관리</b></h1>
    <p class="lead">식단과 운동은 같이 봐야 한다 — 먹은 것과 태운 것</p>
  </div>
  <div class="tabs">
    <button class="tb on" data-t="diet">식단 · 칼로리</button>
    <button class="tb" data-t="gym">운동 기록</button>
  </div>
</header>
<main>
  <iframe id="f-diet" src="식단.html" title="식단 · 칼로리"></iframe>
  <iframe id="f-gym" class="hide" src="운동.html" title="운동 기록"
    loading="lazy"></iframe>
</main>
<script>
// 마지막으로 본 칸을 기억한다
const LS='body_tab';
const get=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const set=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
function show(t){
  document.querySelectorAll('.tb').forEach(b=>
    b.classList.toggle('on',b.dataset.t===t));
  document.getElementById('f-diet').classList.toggle('hide',t!=='diet');
  document.getElementById('f-gym').classList.toggle('hide',t!=='gym');
  set(LS,t);
}
document.querySelectorAll('.tb').forEach(b=>
  b.onclick=()=>show(b.dataset.t));
show(get(LS)==='gym'?'gym':'diet');
</script>
<script>
(function(){
 var B='http://127.0.0.1:8765', K='NY_VYjt2P89920mftfQRhaQj';
 var P=Storage.prototype, setI=P.setItem, delI=P.removeItem;
 var Q='__pending', live=false, buf={}, timer=null;
 function pend(){try{return JSON.parse(localStorage.getItem(Q)||'{}');}
   catch(e){return {};}}
 function setPend(o){try{setI.call(localStorage,Q,JSON.stringify(o));}
   catch(e){}}
 function badge(){
   var n=document.getElementById('__syncbadge');
   if(!n){n=document.createElement('div');n.id='__syncbadge';
     n.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99998;'+
       'font:600 12px/1.4 inherit;padding:7px 13px;border-radius:20px;'+
       'box-shadow:0 2px 10px rgba(0,0,0,.14);cursor:default';
     document.body.appendChild(n);}
   var k=Object.keys(pend()).length;
   clearTimeout(n.__t);
   n.style.transition='opacity .4s';n.style.opacity='1';
   if(live){n.style.background='#0f766e';n.style.color='#fff';
     n.textContent='기록 중 · 파일에 저장됨';
     // 잘 되고 있으면 굳이 계속 띄워 둘 필요가 없다
     n.__t=setTimeout(function(){n.style.opacity='0';},3500);}
   else{n.style.background='#c2410c';n.style.color='#fff';
     n.textContent=k?('기록 '+k+' 건 대기 · PC 켜면 저장된다')
                    :'이 기기에서는 파일에 저장 안 됨';}
 }
 function push(d,cb){
   fetch(B+'/api/ls?k='+K,{method:'POST',mode:'cors',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({d:d})})
    .then(function(r){live=r.ok;if(r.ok&&cb)cb();badge();})
    .catch(function(){live=false;badge();});
 }
 function flush(){
   timer=null;
   var o=pend();
   for(var k in buf)o[k]=buf[k];
   buf={};
   if(!Object.keys(o).length)return;
   setPend(o);
   push(o,function(){setPend({});});
 }
 function queue(k,v){
   if(k===Q)return;
   buf[k]=v;clearTimeout(timer);timer=setTimeout(flush,600);
 }
 P.setItem=function(k,v){setI.call(this,k,v);
   if(this===localStorage)queue(k,String(v));};
 P.removeItem=function(k){delI.call(this,k);
   if(this===localStorage)queue(k,null);};
 addEventListener('pagehide',flush);
 // 처음에 서버 것을 받아 온다 — 서버가 원본이다
 fetch(B+'/api/ls?k='+K,{mode:'cors'})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(j){
    if(!j)return;
    live=true;
    (j.x||[]).forEach(function(k){delI.call(localStorage,k);});
    var mine={}, changed=false;
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k!==Q&&!(k in j.d)&&(j.x||[]).indexOf(k)<0)
        mine[k]=localStorage.getItem(k);
    }
    // 서버 값으로 무조건 덮지 않는다. 양쪽이 JSON 객체면 '합친다'.
    // (예전엔 서버가 원본이라 브라우저에만 있던 체크가 통째로 날아갔다)
    function merge(a,b){
      try{
        var A=JSON.parse(a), B=JSON.parse(b);
        if(A&&B&&typeof A==='object'&&typeof B==='object'&&
           !Array.isArray(A)&&!Array.isArray(B)){
          var o={}; for(var x in A)o[x]=A[x];
          for(var y in B)o[y]=B[y];   // 브라우저 쪽이 이긴다
          return JSON.stringify(o);
        }
      }catch(e){}
      return null;
    }
    var back={};
    for(var k2 in j.d){
      var cur=localStorage.getItem(k2);
      var m=(cur===null)?null:merge(j.d[k2],cur);
      var val=(m!==null)?m:(cur===null?j.d[k2]:cur);
      if(cur!==val)changed=true;
      setI.call(localStorage,k2,val);
      if(val!==j.d[k2])back[k2]=val;   // 서버에도 돌려준다
    }
    if(Object.keys(back).length)push(back);
    var q=pend();for(var k3 in q)mine[k3]=q[k3];
    if(Object.keys(mine).length)push(mine,function(){setPend({});});
    badge();
    // 값이 실제로 달라졌을 때만, 그것도 이 탭에서 딱 한 번만 다시 그린다.
    // (예전엔 무조건 reload 라 무한 새로고침이 났다)
    // 서버 판 번호를 적어 두고, 같은 판이면 다시 그리지 않는다.
    // (무조건 reload 면 무한 고리, 한 번만이면 나중 변경을 놓친다)
    try{
      var lastv=sessionStorage.getItem('__syncv');
      if(changed&&String(j.v)!==lastv){
        sessionStorage.setItem('__syncv',String(j.v));
        location.reload();
      }else if(!lastv){
        sessionStorage.setItem('__syncv',String(j.v));
      }
    }catch(e){}
  })
  .catch(function(){live=false;badge();});
 addEventListener('DOMContentLoaded',badge);
 setInterval(function(){ if(!live) flush(); }, 20000);
})();
</script>
</body></html>
