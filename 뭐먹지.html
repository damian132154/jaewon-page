 </div>
</div>
<footer>지도는 OpenStreetMap · 가게 정보는 카카오맵에서 본다</footer>

const LSH='eat_history', LSC='eat_custom';
// localStorage 가 막힌 환경에서도 죽지 않게
const LSget=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const LSset=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let HIST=[],CUSTOM=[];
try{HIST=JSON.parse(LSget(LSH)||'[]');}catch(e){}
try{CUSTOM=JSON.parse(LSget(LSC)||'[]');}catch(e){}
// 식단 · 칼로리 페이지에 적은 것도 같이 본다
function dietEaten(){
  let D={};
  try{D=JSON.parse(LSget('diet_log')||'{}');}catch(e){return [];}
  const out=[];
  Object.keys(D).sort().reverse().forEach(k=>{
    (D[k].items||[]).slice().reverse().forEach(x=>{
      out.push({n:x.n,k:Math.round(x.k*(x.q||1)),m:x.m||'',e:'🍽',
                d:k.slice(5),t:'',src:'식단'});
    });
  });
  return out;
}
function merged(){
  const a=HIST.map(h=>Object.assign({src:'룰렛'},h));
  return a.concat(dietEaten()).sort((x,y)=>
    (y.d+(y.t||'')).localeCompare(x.d+(x.t||'')));
}

const CATS=['한식','중식','일식','양식','분식','아시안','건강','간편'];
const OPTS=['국물','고기','면','매움','가벼움','저칼로리','빠름','여럿',
 '해장','채소','단백질','든든'];
let selMeal='',selCat=new Set(),selOpt=new Set(),last=null;
let SKIP=+(LSget('eat_skip')??5);
function el(i){return document.getElementById(i);}
function autoMeal(){const h=new Date().getHours();
  return h<10?'아침':h<15?'점심':h<21?'저녁':'간식 (야식)';}
selMeal=autoMeal();
el('autoslot').textContent='지금은 '+selMeal;

function seg(box,list,set,cls){
  list.forEach(n=>{
    const b=document.createElement('button');
    b.className='sg'+(cls?' '+cls:'');b.textContent=n;
    b.onclick=()=>{
      if(set==='meal'){selMeal=(selMeal===n?'':n);
        box.querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));
        if(selMeal===n)b.classList.add('on');
      }else{if(set.has(n))set.delete(n);else set.add(n);
        b.classList.toggle('on',set.has(n));}
      pool();
    };
    if(set==='meal'&&n===selMeal)b.classList.add('on');
    box.appendChild(b);
  });
}
seg(el('segMeal'),M,'meal');
seg(el('segCat'),CATS,selCat,'gr');
seg(el('segOpt'),OPTS,selOpt,'bl');
[['안 뺌',0],['3끼',3],['5끼',5],['10끼',10],['20끼',20]].forEach(([n,v])=>{
  const b=document.createElement('button');
  b.className='sg'+(SKIP===v?' on':'');b.textContent=n;
  b.onclick=()=>{SKIP=v;LSset('eat_skip',v);
    el('segSkip').querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');pool();};
  el('segSkip').appendChild(b);
});

// 직접 추가한 것 청소 — 목록에 이미 있거나 저희끼리 겹치는 이름은 버린다
(function(){
  const seen=new Set(DB.map(f=>f[0]));
  const keep=[];
  CUSTOM.forEach(c=>{
    const n=c&&String(c.n||'').trim();
    if(!n||seen.has(n))return;
    seen.add(n);keep.push({n:n,k:+c.k||0});
  });
  if(keep.length!==CUSTOM.length){CUSTOM=keep;LSset(LSC,JSON.stringify(CUSTOM));}
})();
function all(){
  const seen=new Set(),out=[];
  DB.concat(CUSTOM.map(c=>[c.n,c.k,'','직접','','🍽'])).forEach(f=>{
    if(seen.has(f[0]))return;
    seen.add(f[0]);out.push(f);
  });
  return out;
}
function pick(){
  const recent=SKIP?merged().slice(0,SKIP).map(h=>h.n):[];
  let list=all().filter(f=>{
    if(selMeal&&f[2]){
      const key=selMeal==='간식 (야식)'?'야식':selMeal;
      if(!f[2].split(',').includes(key))return false;
    }
    if(selCat.size&&!selCat.has(f[3]))return false;
    if(selOpt.size){const tg=(f[4]||'').split(',');
      for(const o of selOpt)if(!tg.includes(o))return false;}
    if(!hit(f[0],FQ))return false;
    return true;
  });
  if(!list.length)return null;
  const fresh=list.filter(f=>!recent.includes(f[0]));
  return fresh.length?fresh:list;
}

// 한글 초성 검색 — 「ㅅㄱㄱㅂ」 으로도 「삼각김밥」 이 나온다
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s){let o='';for(const c of s){const u=c.charCodeAt(0)-0xAC00;
  o+=(u>=0&&u<11172)?CHO[Math.floor(u/588)]:c;}return o;}
function norm(s){return s.replace(/\s+/g,'').toLowerCase();}
function hit(name,q){
  if(!q)return true;
  const n=norm(name),s=norm(q);
  if(n.includes(s))return true;
  return /^[ㄱ-ㅎ]+$/.test(s)&&cho(n).includes(s);
}
function live(input,fn){
  // 한글은 조합이 끝나야 input 이 뜨는 브라우저가 있다. 셋 다 듣는다.
  const go=()=>fn(input.value.trim());
  ['input','keyup','compositionupdate','compositionend'].forEach(
    e=>input.addEventListener(e,go));
}

let FQ='';
function pool(){
  const l=pick();
  el('pool').textContent=l?('후보 '+l.length+' 개'+
    (SKIP?'　·　최근 '+Math.min(SKIP,merged().length)+' 끼 제외':'')):
    '조건에 맞는 게 없다. 조건을 풀어라.';
  el('cands').innerHTML=l?l.slice(0,24).map(f=>
    '<span class="cd">'+(f[5]||'')+' '+f[0]+'</span>').join(''):'';
  drawWheel(l||[]);
}
const COL=['#fde8d8','#fff3e6','#ffe4d1','#fff7f0','#fdead9','#fff1e4',
 '#ffe9da','#fff5ec'];
let ANG=0,FACE=[];
function drawWheel(list){
  const w=el('wheel');
  FACE=list.slice().sort(()=>Math.random()-0.5).slice(0,8);
  const n=Math.max(1,FACE.length);
  const deg=360/n;
  w.style.background='conic-gradient('+Array.from({length:n},(_,i)=>
    COL[i%COL.length]+' '+(i*deg)+'deg '+((i+1)*deg)+'deg').join(',')+')';
  const R=(w.clientWidth||250)*0.34;      // 가운데에서 이모지까지 거리
  w.innerHTML=Array.from({length:n},(_,i)=>
    '<div class="sl" style="transform:rotate('+(i*deg+deg/2)+'deg)">'+
    '<span style="top:'+(-R-11)+'px">'+
    ((FACE[i]&&FACE[i][5])||'🍽')+'</span></div>').join('');
}
function roll(){
  const l=pick();
  if(!l||!l.length){el('slot').innerHTML='—';
    el('meta').textContent='조건에 맞는 게 없다';return;}
  drawWheel(l);                 // 누를 때마다 후보 전체에서 8 개를 새로 올린다
  const n=FACE.length,deg=360/n;
  const idx=Math.floor(Math.random()*n);
  const f=FACE[idx];
  ANG+=360*6-((ANG%360)+idx*deg+deg/2);
  el('wheel').style.transform='rotate('+ANG+'deg)';
  el('slot').innerHTML='<span class="emo">🎲</span>';
  el('meta').textContent='';
  setTimeout(()=>{
    last=f;
    el('slot').innerHTML='<span class="emo">'+(f[5]||'')+'</span>'+f[0];
    el('meta').innerHTML='<span class="kc">'+f[1]+' kcal</span>'+
      (f[3]?'　·　'+f[3]:'')+(f[4]?'　·　'+f[4].split(',').join(' · '):'');
    el('pickname').textContent=(f[5]||'')+' '+f[0];
  },4100);
}
live(el('fq'),v=>{FQ=v;pool();});
el('roll').onclick=roll;
el('again').onclick=roll;
el('eat').onclick=()=>{
  if(!last)return;
  const d=new Date();
  HIST.unshift({n:last[0],k:last[1],m:selMeal||autoMeal(),e:last[5]||'',
    d:d.toISOString().slice(5,10),
    t:String(d.getHours()).padStart(2,'0')+':'+
      String(d.getMinutes()).padStart(2,'0')});
  HIST=HIST.slice(0,100);
  LSset(LSH,JSON.stringify(HIST));
  hist();pool();
  const b=el('eat');b.textContent='기록했다';
  setTimeout(()=>b.textContent='이걸로 먹음',1200);
};
function hist(){
  const all=merged();
  const nd=all.length-HIST.length;
  el('histinfo').textContent=all.length+' 개'+(nd?'　(식단 '+nd+')':'');
  el('hist').innerHTML=all.slice(0,12).map(h=>
    '<div class="hr"><span class="hd">'+h.d+' '+(h.t||'')+'</span>'+
    '<span class="hn">'+(h.e||'')+' '+h.n+'</span>'+
    (h.src==='식단'?'<span class="nc">식단</span>':'')+
    '<span>'+h.k+'</span>'+
    '<button class="hz" data-a="'+encodeURIComponent(h.n)+'|'+h.k+
      '|'+(h.e||'')+'">또</button>'+
    (h.src==='룰렛'?'<button class="hx" data-n="'+
      encodeURIComponent(h.n)+'">✕</button>':'')+'</div>'
  ).join('')||'<div class="tip">아직 없다. 뽑고 「이걸로 먹음」 을 누르거나 '+
    '식단 페이지에 적으면 여기 쌓인다.</div>';
  el('hist').querySelectorAll('.hz').forEach(b=>b.onclick=()=>{
    const [n,k,e]=b.dataset.a.split('|');
    eatIt(decodeURIComponent(n),+k,e);
  });
  el('hist').querySelectorAll('.hx').forEach(b=>b.onclick=()=>{
    const n=decodeURIComponent(b.dataset.n);
    const i=HIST.findIndex(h=>h.n===n);
    if(i>=0)HIST.splice(i,1);
    LSset(LSH,JSON.stringify(HIST));hist();pool();});
}
// ── 먹은 것 적기 ──────────────────────────────
let eatMeal=autoMeal();
M.forEach(n=>{
  const b=document.createElement('button');
  b.className='sg'+(n===eatMeal?' on':'');b.textContent=n;
  b.onclick=()=>{eatMeal=n;
    el('mealseg').querySelectorAll('.sg').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');};
  el('mealseg').appendChild(b);
});
let acPick=null;
function ac(){
  const s=el('cn').value.trim(), box=el('acbox');
  if(!s){box.classList.remove('on');box.innerHTML='';return;}
  const hits=all().filter(f=>hit(f[0],s)).slice(0,12);
  if(!hits.length){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=hits.map(f=>
    '<div class="ac" data-n="'+encodeURIComponent(f[0])+'" data-k="'+f[1]+'">'+
    '<span>'+(f[5]||'🍽')+'</span><span class="an">'+f[0]+'</span>'+
    '<span class="ak">'+f[1]+' kcal</span></div>').join('');
  box.classList.add('on');
  box.querySelectorAll('.ac').forEach(r=>r.onclick=()=>{
    el('cn').value=decodeURIComponent(r.dataset.n);
    el('ck').value=r.dataset.k;
    acPick=[decodeURIComponent(r.dataset.n),+r.dataset.k];
    box.classList.remove('on');
  });
}
live(el('cn'),ac);
el('cn').addEventListener('blur',()=>setTimeout(
  ()=>el('acbox').classList.remove('on'),180));
// 식단 페이지에도 같이 남긴다 — 거기 칼로리 합산에 잡히게
function toDiet(n,k,m){
  let D={};
  try{D=JSON.parse(LSget('diet_log')||'{}');}catch(e){D={};}
  const d=new Date(), key=d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
  D[key]=D[key]||{items:[]};
  D[key].items.push({n:n,k:k,c:0,p:0,ft:0,q:1,
    m:(m==='간식 (야식)'?'야식':m)});
  LSset('diet_log',JSON.stringify(D));
}
function eatIt(n,k,e,m){
  const d=new Date();
  HIST.unshift({n:n,k:k,m:m||eatMeal,e:e||'🍽',
    d:d.toISOString().slice(5,10),
    t:String(d.getHours()).padStart(2,'0')+':'+
      String(d.getMinutes()).padStart(2,'0')});
  HIST=HIST.slice(0,100);
  LSset(LSH,JSON.stringify(HIST));
  toDiet(n,k,m||eatMeal);
  hist();pool();
}
function flash(id,msg){
  const b=el(id), old=b.textContent;
  b.textContent=msg;setTimeout(()=>b.textContent=old,1200);
}
el('cate').onclick=()=>{
  const n=el('cn').value.trim();
  let k=+el('ck').value||0;
  if(!n)return;
  const known=all().find(f=>f[0]===n);
  if(!k&&known)k=known[1];
  eatIt(n,k,known?known[5]:'🍽');
  if(!known){CUSTOM.push({n:n,k:k});LSset(LSC,JSON.stringify(CUSTOM));}
  el('cn').value='';el('ck').value='';el('acbox').classList.remove('on');
  flash('cate','기록했다');
};
el('cadd').onclick=()=>{
  const n=el('cn').value.trim(),k=+el('ck').value||0;
  if(!n)return;
  if(!all().find(f=>f[0]===n)){
    CUSTOM.push({n:n,k:k});LSset(LSC,JSON.stringify(CUSTOM));
  }
  el('cn').value='';el('ck').value='';el('acbox').classList.remove('on');
  pool();flash('cadd','후보에 넣음');
};
// ── 주변 검색 ─────────────────────────────────
let LOC=null;
function locate(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(
    p=>{LOC=p.coords;
        el('nearinfo').textContent='위치 확인됨 — 내 주변으로 찾는다';},
    ()=>{el('nearinfo').textContent='위치 없이 지역 검색';},
    {enableHighAccuracy:true,timeout:8000,maximumAge:300000});
}
function openMap(kind){
  const nm=last?last[0]:'';
  if(!nm)return;
  const q=encodeURIComponent(nm);   // 메뉴 이름만. 「맛집」 안 붙인다
  if(kind==='k'){
    const u=LOC
      ? 'https://map.kakao.com/?q='+q+'&urlX='+Math.round(LOC.longitude*1e6)+
        '&urlY='+Math.round(LOC.latitude*1e6)+'&urlLevel=4'
      : 'https://map.kakao.com/?q='+q;
    window.open(u,'_blank');
  }else{
    const u='https://map.naver.com/p/search/'+q;
    window.open(LOC?u+'?c=15.00,0,0,0,dh&x='+LOC.longitude+'&y='+LOC.latitude:u,
      '_blank');
  }
}
el('reload').onclick=()=>location.replace(location.href.split('#')[0].split('?')[0]+'?v='+Date.now());
el('mapK').onclick=()=>openMap('k');
el('mapN').onclick=()=>openMap('n');
locate();

setInterval(()=>{
  const d=new Date();
  el('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+

},1000);
