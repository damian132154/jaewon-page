<!doctype html>
<html lang="ko"><head>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루 기록</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#151922;--ink2:#5b6472;--ink3:#98a0ac;
--line:#e6e9ee;--navy:#1f3251;--warm:#c2410c;--green:#0f766e;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
 font-family:"맑은 고딕",Malgun Gothic,system-ui,sans-serif;
 background:radial-gradient(900px 420px at 50% -12%,#eef2ff 0%,transparent 62%),
 var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding:44px 20px 90px}
header{text-align:center;margin-bottom:8px}
h1{margin:0 0 5px;font-size:28px;font-weight:800;letter-spacing:-.02em}
h1 b{color:var(--blue)}
.lead{margin:0;color:var(--ink2);font-size:13px}
#today{text-align:center;font-size:14px;color:var(--ink2);margin:8px 0 26px;
 font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;
 padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(21,25,34,.05);
 border-top:3px solid var(--c,var(--blue))}
.ch{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.ci{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;
 justify-content:center;font-size:15px;color:var(--c,var(--blue));
 background:color-mix(in srgb,var(--c,#2563eb) 12%,#fff)}
.ct{font-size:14.5px;font-weight:700}
.cs{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:auto}
textarea,input[type=text]{width:100%;border:1px solid var(--line);
 border-radius:10px;padding:11px 13px;font-size:13.5px;font-family:inherit;
 outline:none;resize:vertical;line-height:1.6;color:var(--ink)}
textarea:focus,input[type=text]:focus{border-color:var(--c,var(--blue))}
.g3{display:flex;flex-direction:column;gap:7px}
.mood{display:flex;gap:5px;flex-wrap:wrap}
.mb{flex:1;min-width:34px;border:1px solid var(--line);background:#fff;
 border-radius:9px;padding:9px 0;font-size:13px;cursor:pointer;
 font-family:inherit;color:var(--ink2);font-weight:700}
.mb:hover{border-color:var(--blue)}
.mb.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.moodnote{margin-top:8px;font-size:12px;color:var(--ink3)}
.pick{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.seg{padding:8px 18px;border:1px solid var(--line);background:#fff;
 color:var(--ink2);border-radius:20px;font-size:12.5px;cursor:pointer;
 font-family:inherit;font-weight:700}
.seg.on{background:var(--warm);color:#fff;border-color:var(--warm)}
.pick button#roll{padding:10px 20px;border:none;border-radius:10px;
 background:var(--warm);color:#fff;font-size:13.5px;font-weight:700;
 cursor:pointer;font-family:inherit}
#menu{font-size:22px;font-weight:800;letter-spacing:-.02em;min-width:120px}
.quote{font-size:14px;line-height:1.75;color:var(--ink);font-style:italic}
.qwho{font-size:12px;color:var(--ink3);margin-top:7px;font-style:normal}
.saved{font-size:11.5px;color:var(--green);opacity:0;transition:.2s}
.saved.on{opacity:1}
.hist{margin-top:26px}
.hist h2{font-size:14px;margin:0 0 10px;color:var(--ink2)}
.hrow{background:#fff;border:1px solid var(--line);border-radius:11px;
 padding:12px 15px;margin-bottom:8px;font-size:12.5px;color:var(--ink2);
 line-height:1.6}
.hd{font-weight:700;color:var(--ink);font-family:ui-monospace,Consolas,monospace;
 margin-right:8px}
.hm{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;
 font-weight:700;background:#eef2ff;color:var(--blue);margin-right:7px}
footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:36px;
 line-height:1.8}
</style></head><body>
<div class="wrap">
<header><h1>하루 <b>기록</b></h1>
<p class="lead">쓰면 저장된다. 안 써도 된다.</p></header>
<div id="today"></div>

<div class="card" style="--c:#2563eb">
  <div class="ch"><div class="ci">✎</div><div class="ct">한 줄 일기</div>
    <span class="saved" id="s1">저장됨</span></div>
  <textarea id="diary" rows="2" placeholder="오늘 하루를 한 줄로."></textarea>
</div>

<div class="card" style="--c:#0f766e">
  <div class="ch"><div class="ci">♡</div><div class="ct">감사한 것 세 개</div>
    <span class="saved" id="s2">저장됨</span></div>
  <div class="g3">
    <input type="text" id="t1" placeholder="1.">
    <input type="text" id="t2" placeholder="2.">
    <input type="text" id="t3" placeholder="3.">
  </div>
</div>

<div class="card" style="--c:#7c3aed">
  <div class="ch"><div class="ci">◑</div><div class="ct">기분 점수</div>
    <span class="cs">1 = 최악 · 10 = 최고</span></div>
  <div class="mood" id="mood"></div>
  <div class="moodnote" id="moodnote">아직 안 눌렀다.</div>
</div>

<div class="card" style="--c:#b45309">
  <div class="ch"><div class="ci">❝</div><div class="ct">오늘의 한마디</div></div>
  <div class="quote" id="quote"></div>
  <div class="qwho" id="qwho"></div>
</div>

<div class="hist"><h2>지난 기록</h2><div id="hist"></div></div>

<footer>이 브라우저에 저장된다 · 개인 페이지 「도구」 칸에서 열 수 있다</footer>
</div>
<script>
const LS='daily_log';
const KEY=new Date().toISOString().slice(0,10);
let DB={};
try{DB=JSON.parse(localStorage.getItem(LS)||'{}');}catch(e){DB={};}
const cur=()=>DB[KEY]||(DB[KEY]={});
function save(id){
  localStorage.setItem(LS,JSON.stringify(DB));
  if(id){const e=document.getElementById(id);
    e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1100);}
  hist();
}
const d=new Date();
document.getElementById('today').textContent=
  d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+
  ['일','월','화','수','목','금','토'][d.getDay()]+'요일';

// 한 줄 일기 · 메모
[['diary','s1']].forEach(([k,s])=>{
  const el=document.getElementById(k);
  el.value=cur()[k]||'';
  let t=null;
  el.addEventListener('input',()=>{
    cur()[k]=el.value;clearTimeout(t);t=setTimeout(()=>save(s),500);
  });
});
// 감사 3
['t1','t2','t3'].forEach(k=>{
  const el=document.getElementById(k);
  el.value=(cur()[k]||'');
  let t=null;
  el.addEventListener('input',()=>{
    cur()[k]=el.value;clearTimeout(t);t=setTimeout(()=>save('s2'),500);
  });
});
// 기분
const mood=document.getElementById('mood');
const MN={1:'힘든 날이었다',2:'힘든 날이었다',3:'별로였다',4:'별로였다',
 5:'그냥 그랬다',6:'그냥 그랬다',7:'괜찮았다',8:'괜찮았다',
 9:'좋은 날이었다',10:'좋은 날이었다'};
for(let i=1;i<=10;i++){
  const b=document.createElement('button');
  b.className='mb';b.textContent=i;b.dataset.v=i;
  b.onclick=()=>{cur().mood=i;paintMood();save();};
  mood.appendChild(b);
}
function paintMood(){
  const v=cur().mood;
  mood.querySelectorAll('.mb').forEach(b=>
    b.classList.toggle('on',+b.dataset.v===v));
  document.getElementById('moodnote').textContent=
    v?(v+' 점 — '+MN[v]):'아직 안 눌렀다.';
}
paintMood();
// 한마디 — 날짜로 고정되어 하루 동안 같은 것이 뜬다
const Q=[
 ['완벽한 계획보다 오늘 돌린 한 판이 낫다.',''],
 ['가장 중요한 것은 결코 급하지 않다. 그래서 미뤄진다.','아이젠하워'],
 ['배는 항구에 있을 때 가장 안전하다. 그러나 그러라고 만든 것이 아니다.',''],
 ['시작이 반이라는 말은 시작이 그만큼 어렵다는 뜻이다.',''],
 ['실험이 실패한 것이 아니라, 그 조건이 아니라는 것을 알아낸 것이다.',''],
 ['오늘 할 수 있는 만큼만 한다. 그게 매일이면 충분하다.',''],
 ['남과 비교하면 끝이 없고, 어제의 나와 비교하면 끝이 있다.',''],
 ['재능은 계속하는 사람을 이기지 못한다.',''],
 ['막히면 크기를 줄여라. 한 판이 어려우면 한 조건만.',''],
 ['논문은 쓰는 것이 아니라 고치는 것이다.',''],
 ['모르는 것을 모른다고 적어두면 그게 다음 실험이 된다.',''],
 ['잘 쉰 날이 잘 한 날의 조건이다.',''],
 ['데이터는 거짓말하지 않는다. 다만 우리가 성급하게 읽을 뿐이다.',''],
 ['하루를 살아낸 것만으로 오늘은 성공이다.','']
];
const qi=Math.floor(Date.now()/86400000)%Q.length;
document.getElementById('quote').textContent='"'+Q[qi][0]+'"';
document.getElementById('qwho').textContent=Q[qi][1]?'— '+Q[qi][1]:'';
// 지난 기록
function hist(){
  const box=document.getElementById('hist');
  const ks=Object.keys(DB).filter(k=>k!==KEY).sort().reverse().slice(0,14);
  if(!ks.length){box.innerHTML=
    '<div class="hrow">아직 없다. 오늘이 첫 날이다.</div>';return;}
  box.innerHTML=ks.map(k=>{
    const v=DB[k]||{};
    const bits=[];
    if(v.mood)bits.push('<span class="hm">'+v.mood+'점</span>');
    if(v.diary)bits.push(v.diary);
    const th=[v.t1,v.t2,v.t3].filter(Boolean);
    if(th.length)bits.push('<span style="color:#0f766e">♡ '+
      th.join(' · ')+'</span>');
    if(!bits.length)return '';
    return '<div class="hrow"><span class="hd">'+k.slice(5)+'</span>'+
      bits.join(' ')+'</div>';
  }).join('')||'<div class="hrow">아직 없다.</div>';
}
hist();
</script>
</body></html>
